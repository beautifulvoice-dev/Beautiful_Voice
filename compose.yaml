services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beautifulvoice}
      POSTGRES_USER: ${POSTGRES_USER:-bv_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bv_local_only}
      BV_LOCAL_APP_DB_PASSWORD: ${BV_LOCAL_APP_DB_PASSWORD:-bv_app_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./apps/server/db/local-role.sql:/bv/local-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
