# PR 자동 AI 리뷰. 사람 승인을 대체하지 않는다 (docs/kickoff/04-dev-rules.md §4).
# 인증: Claude 구독 토큰(종량제 API 키 아님). 토큰 주인의 구독 사용량에서 차감된다.
#   1) 토큰 담당자(개발 리더 권장)가 로컬에서 `claude setup-token` 실행
#   2) 출력된 토큰을 저장소 Secrets에 CLAUDE_CODE_OAUTH_TOKEN 으로 등록
# 운영 전 액션 버전을 커밋 SHA로 고정할 것.
name: AI Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'ai-review:skip')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            CLAUDE.md와 docs/kickoff/04-dev-rules.md 기준으로 이 PR을 한국어로 리뷰한다.
            우선순위:
            1. 정확성 버그, 연결된 이슈 수용 기준 미충족
            2. shop_id 격리 누락, 인증·권한 문제, 로그의 개인정보, 하드코딩된 비밀값
            3. 쓰기 경로의 멱등성·실패 처리, 예약 충돌 규칙 우회, AI가 승인 없이 데이터를 변경하는 경로
            4. 도메인 로직의 테스트 누락
            5. PM 원본 문서(docs/product/source/)나 실제 고객 데이터가 커밋에 포함되면 반드시 지적 (공개 저장소)
            스타일 지적은 하지 않는다(포매터 담당). 확신이 낮은 지적은 "질문"으로 표시한다.
            구체적 코드 문제는 인라인 코멘트로, 전체 요약은 `gh pr comment`로 1개만 남긴다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
