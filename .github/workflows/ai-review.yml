# PR 자동 AI 리뷰. 사람 승인을 대체하지 않는다 (docs/kickoff/04-dev-rules.md §4).
# 인증: Claude 구독 토큰(종량제 API 키 아님). **PR 작성자 본인의 구독 사용량에서 차감**된다.
#   - 작성자 토큰 Secret 이름: CLAUDE_TOKEN_<GitHub 아이디 대문자, 영숫자 외 문자는 _>
#     예) parkganghyun123-sketch → CLAUDE_TOKEN_PARKGANGHYUN123_SKETCH
#   - 작성자 토큰이 없으면 공용 토큰 CLAUDE_CODE_OAUTH_TOKEN 으로 대신 실행하고 경고를 남긴다.
#   - 등록 절차: docs/kickoff/04-dev-rules.md §6 "AI 리뷰 토큰"
# 운영 전 액션 버전을 커밋 SHA로 고정할 것.
name: AI Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'ai-review:skip')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 코멘트 작성은 Claude GitHub 앱 권한으로 수행하므로 워크플로 토큰은 읽기 전용(최소 권한).
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # PR 작성자 아이디 → Secret 이름. 아이디는 env로만 전달(스크립트 주입 방지).
      - name: 토큰 선택 (PR 작성자 본인 구독)
        id: who
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          name="CLAUDE_TOKEN_$(printf '%s' "$LOGIN" | tr '[:lower:]' '[:upper:]' | tr -c 'A-Z0-9' '_')"
          echo "secret_name=$name" >> "$GITHUB_OUTPUT"
      - name: 토큰 출처 기록
        env:
          SECRET_NAME: ${{ steps.who.outputs.secret_name }}
          HAS_OWN: ${{ secrets[steps.who.outputs.secret_name] != '' }}
        run: |
          if [ "$HAS_OWN" = "true" ]; then
            echo "✅ PR 작성자 본인 토큰($SECRET_NAME)으로 리뷰" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ $SECRET_NAME 미등록 → 공용 토큰(CLAUDE_CODE_OAUTH_TOKEN)으로 리뷰" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::$SECRET_NAME 미등록. 공용 토큰 사용 중 — 04-dev-rules.md §6 참고해 본인 토큰을 등록하세요."
          fi
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets[steps.who.outputs.secret_name] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            CLAUDE.md와 docs/kickoff/04-dev-rules.md 기준으로 이 PR을 한국어로 리뷰한다.
            우선순위:
            1. 정확성 버그, 연결된 이슈 수용 기준 미충족
            2. shop_id 격리 누락, 인증·권한 문제, 로그의 개인정보, 하드코딩된 비밀값
            3. 쓰기 경로의 멱등성·실패 처리, 예약 충돌 규칙 우회, AI가 승인 없이 데이터를 변경하는 경로
            4. 도메인 로직의 테스트 누락
            5. PM 원본 문서(docs/product/source/)나 실제 고객 데이터가 커밋에 포함되면 반드시 지적 (공개 저장소)
            스타일 지적은 하지 않는다(포매터 담당). 확신이 낮은 지적은 "질문"으로 표시한다.
            구체적 코드 문제는 인라인 코멘트로, 전체 요약은 `gh pr comment`로 1개만 남긴다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
