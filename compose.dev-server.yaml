services:
  api:
    build:
      context: .
      target: api
    env_file:
      - ${BV_SERVER_ENV_FILE:-.env.dev-server}
    environment:
      NODE_ENV: production
      BV_API_HOST: 0.0.0.0
    volumes:
      - type: bind
        source: ${BV_RDS_CA_FILE:-./deploy/rds-ca.pem}
        target: /run/rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      BV_WEB_SITE_ADDRESS: ${BV_WEB_SITE_ADDRESS:-:80}
    ports:
      - "${BV_WEB_BIND_ADDRESS:-127.0.0.1}:${BV_WEB_HTTP_PORT:-8080}:80"
      - "${BV_WEB_BIND_ADDRESS:-127.0.0.1}:${BV_WEB_HTTPS_PORT:-8443}:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy-data:/data
    restart: unless-stopped

volumes:
  caddy-data:
